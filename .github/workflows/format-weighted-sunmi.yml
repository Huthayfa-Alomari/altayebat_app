name: One-time Dart formatter

on:
  push:
    branches: [chatgpt-weighted-sunmi]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-weighted-sunmi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart sources
        run: dart format altayebat_app/lib altayebat_app/test
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- altayebat_app/lib altayebat_app/test; then
            echo "Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altayebat_app/lib altayebat_app/test
          git commit -m "style: format Dart sources"
          git push origin HEAD:chatgpt-weighted-sunmi
