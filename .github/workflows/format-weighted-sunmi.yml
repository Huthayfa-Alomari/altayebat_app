name: One-time Dart formatter

on:
  push:
    branches: [chatgpt-weighted-sunmi]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: altayebat_app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-weighted-sunmi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Dart sources"
          git push origin HEAD:chatgpt-weighted-sunmi
