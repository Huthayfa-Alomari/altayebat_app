name: Quality Checks

on:
  push:
    branches: [main, chatgpt-production-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: altayebat_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: |
          dart format --output=none lib test
          if ! git diff --exit-code -- lib test; then
            echo "::warning::Dart source files need formatting. Run 'dart format lib test' locally and commit the result."
          fi
      - run: flutter analyze
      - run: flutter test

  admin:
    name: Admin typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Admin/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
