name: Quality Checks

on:
  push:
    branches: [main, chatgpt-production-upgrade, chatgpt-weighted-sunmi]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, test and Android builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: altayebat_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build customer Android debug APK
        run: flutter build apk --debug
      - name: Upload customer debug APK
        uses: actions/upload-artifact@v7
        with:
          name: altayebat-debug-apk
          path: altayebat_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build SUNMI terminal debug APK
        run: flutter build apk --debug -t lib/main_terminal.dart
      - name: Upload SUNMI terminal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: altayebat-sunmi-terminal-debug-apk
          path: altayebat_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  admin:
    name: Admin typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            audit_output="$(timeout 30s npm audit --omit=dev --audit-level=high 2>&1)"
            audit_status=$?
            printf '%s\n' "$audit_output"

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$audit_status" -eq 124 ]; then
              echo "::warning::npm audit timed out (attempt ${attempt}/3)."
              sleep $((attempt * 5))
              continue
            fi

            if printf '%s\n' "$audit_output" | grep -Eiq '503|Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              echo "::warning::npm audit service unavailable (attempt ${attempt}/3)."
              sleep $((attempt * 5))
              continue
            fi

            # A normal non-zero audit result means npm found vulnerabilities at
            # or above the configured severity threshold. Fail the job.
            exit "$audit_status"
          done

          echo "::warning::npm audit service remained unavailable after 3 bounded attempts; build/typecheck passed, so CI will not fail on registry availability alone."
          exit 0
