name: Quality Checks

on:
  push:
    branches: [main, chatgpt-production-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: altayebat_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: |
          dart format --output=none lib test
          if ! git diff --exit-code -- lib test; then
            echo "::warning::Dart source files need formatting. Run 'dart format lib test' locally and commit the result."
          fi
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug

  admin:
    name: Admin typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Admin/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            audit_output="$(timeout 30s npm audit --omit=dev --audit-level=high 2>&1)"
            audit_status=$?
            printf '%s\n' "$audit_output"

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$audit_status" -eq 124 ]; then
              echo "::warning::npm audit timed out (attempt ${attempt}/3)."
              sleep $((attempt * 5))
              continue
            fi

            if printf '%s\n' "$audit_output" | grep -Eiq '503|Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              echo "::warning::npm audit service unavailable (attempt ${attempt}/3)."
              sleep $((attempt * 5))
              continue
            fi

            # A normal non-zero audit result means npm found vulnerabilities at
            # or above the configured severity threshold. Fail the job.
            exit "$audit_status"
          done

          echo "::warning::npm audit service remained unavailable after 3 bounded attempts; build/typecheck passed, so CI will not fail on registry availability alone."
          exit 0
