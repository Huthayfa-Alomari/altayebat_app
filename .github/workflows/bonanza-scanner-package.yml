name: Bonanza Scanner Package

on:
  pull_request:
    paths:
      - "tools/bonanza_scanner/**"
      - ".github/workflows/bonanza-scanner-package.yml"
  push:
    branches:
      - main
    paths:
      - "tools/bonanza_scanner/**"
      - ".github/workflows/bonanza-scanner-package.yml"

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\Altayebat-Bonanza-Scanner.ps1",
            "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\v0.2\Altayebat-Bonanza-SQL-Scanner.ps1",
            "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\v0.3\Altayebat-Bonanza-SQL-Scanner-v0.3.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }

            Write-Host "PowerShell syntax OK: $file"
          }

      - name: Build v0.1 scanner ZIP
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\bonanza-v01"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\Altayebat-Bonanza-Scanner.ps1" $stage
          Copy-Item "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\Run-Scanner.bat" $stage
          Copy-Item "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\README.md" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\Altayebat_Bonanza_Scanner_v0.1.zip" -CompressionLevel Optimal -Force

      - name: Build v0.2 SQL scanner ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\v0.2\*" -DestinationPath "$env:GITHUB_WORKSPACE\Altayebat_Bonanza_SQL_Scanner_v0.2.zip" -CompressionLevel Optimal -Force

      - name: Build v0.3 SQL scanner ZIP
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\Altayebat_Bonanza_SQL_Scanner_v0.3.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\v0.3\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Format-List Name,Length,FullName

      - name: Upload v0.1 package
        uses: actions/upload-artifact@v4
        with:
          name: altayebat-bonanza-scanner-v0.1
          path: Altayebat_Bonanza_Scanner_v0.1.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload v0.2 SQL package
        uses: actions/upload-artifact@v4
        with:
          name: altayebat-bonanza-sql-scanner-v0.2
          path: Altayebat_Bonanza_SQL_Scanner_v0.2.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload v0.3 SQL package
        uses: actions/upload-artifact@v4
        with:
          name: altayebat-bonanza-sql-scanner-v0.3
          path: Altayebat_Bonanza_SQL_Scanner_v0.3.zip
          if-no-files-found: error
          retention-days: 14
