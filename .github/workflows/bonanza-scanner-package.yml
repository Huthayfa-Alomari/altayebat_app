name: Bonanza Scanner Package

on:
  pull_request:
    paths:
      - "tools/bonanza_scanner/**"
      - ".github/workflows/bonanza-scanner-package.yml"
  push:
    branches:
      - main
    paths:
      - "tools/bonanza_scanner/**"
      - ".github/workflows/bonanza-scanner-package.yml"

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\Altayebat-Bonanza-Scanner.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          Write-Host "PowerShell syntax OK."

      - name: Build scanner ZIP
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\tools\bonanza_scanner\*"
          $zip = "$env:GITHUB_WORKSPACE\Altayebat_Bonanza_Scanner_v0.1.zip"
          Compress-Archive -Path $source -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Format-List Name,Length,FullName

      - name: Upload scanner package
        uses: actions/upload-artifact@v4
        with:
          name: altayebat-bonanza-scanner-v0.1
          path: Altayebat_Bonanza_Scanner_v0.1.zip
          if-no-files-found: error
          retention-days: 14
