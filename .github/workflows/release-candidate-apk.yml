name: Release Candidate Android

on:
  push:
    branches: [main]
    paths:
      - "altayebat_app/**"
      - ".github/workflows/release-candidate-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-candidate:
    name: Validate and build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: altayebat_app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Android signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_KEYSTORE_BASE64:-}" && -n "${RELEASE_STORE_PASSWORD:-}" && -n "${RELEASE_KEY_ALIAS:-}" && -n "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/altayebat-release.jks
            cat > android/key.properties <<EOF
          storePassword=$RELEASE_STORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          storeFile=altayebat-release.jks
          EOF
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
            echo "CAN_BUILD_PLAY_AAB=true" >> "$GITHUB_ENV"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="altayebat-release-candidate"

            keytool -genkeypair -v               -keystore android/app/altayebat-release-candidate.jks               -storepass "$STORE_PASSWORD"               -keypass "$KEY_PASSWORD"               -alias "$KEY_ALIAS"               -keyalg RSA               -keysize 4096               -validity 3650               -dname "CN=Altayebat Release Candidate, OU=Mobile, O=Altayebat, L=Zarqa, ST=Zarqa, C=JO"

            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=altayebat-release-candidate.jks
          EOF
            echo "SIGNING_MODE=temporary-rc" >> "$GITHUB_ENV"
            echo "CAN_BUILD_PLAY_AAB=false" >> "$GITHUB_ENV"
          fi

      - name: Build optimized release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: flutter build apk --release --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"

      - name: Build Play Store AAB
        if: env.CAN_BUILD_PLAY_AAB == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: flutter build appbundle --release --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"

      - name: Verify Android release outputs
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256

          if [[ "$CAN_BUILD_PLAY_AAB" == "true" ]]; then
            AAB="build/app/outputs/bundle/release/app-release.aab"
            test -f "$AAB"
            jarsigner -verify "$AAB"
            sha256sum "$AAB" | tee build/app/outputs/bundle/release/app-release.aab.sha256
          fi
          printf '%s\n' "$SIGNING_MODE" > build/SIGNING_MODE.txt
          printf '%s\n' "$GITHUB_SHA" > build/SOURCE_COMMIT.txt
          echo "Signing mode: $SIGNING_MODE"

      - name: Rename release outputs
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Altayebat-0.3.0-rc.apk
          cp build/app/outputs/flutter-apk/app-release.apk.sha256 build/app/outputs/flutter-apk/Altayebat-0.3.0-rc.apk.sha256
          if [[ "$CAN_BUILD_PLAY_AAB" == "true" ]]; then
            cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Altayebat-0.3.0-play.aab
            cp build/app/outputs/bundle/release/app-release.aab.sha256 build/app/outputs/bundle/release/Altayebat-0.3.0-play.aab.sha256
          fi

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Altayebat-0.3.0-release-candidate-android
          path: |
            altayebat_app/build/app/outputs/flutter-apk/Altayebat-0.3.0-rc.apk
            altayebat_app/build/app/outputs/flutter-apk/Altayebat-0.3.0-rc.apk.sha256
            altayebat_app/build/SIGNING_MODE.txt
            altayebat_app/build/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
