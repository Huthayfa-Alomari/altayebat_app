name: Dart Format Export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: altayebat_app
        run: flutter pub get
      - name: Format Dart
        working-directory: altayebat_app
        run: dart format lib test
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altayebat_app/lib altayebat_app/test altayebat_app/pubspec.lock
          git commit -m "style: apply canonical Dart formatting"
          git push origin HEAD:main
