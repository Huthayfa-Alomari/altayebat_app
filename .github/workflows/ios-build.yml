name: iOS Build Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-build.yml"
      - "altayebat_app/lib/**"
      - "altayebat_app/pubspec.yaml"
      - "altayebat_app/pubspec.lock"
      - "altayebat_app/tool/prepare_ios_release.py"
      - "store_assets/app_icon_1024.png"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-build.yml"
      - "altayebat_app/lib/**"
      - "altayebat_app/pubspec.yaml"
      - "altayebat_app/pubspec.lock"
      - "altayebat_app/tool/prepare_ios_release.py"
      - "store_assets/app_icon_1024.png"

permissions:
  contents: read

jobs:
  ios:
    name: Validate unsigned iOS release
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: altayebat_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Check Xcode and generate iOS platform
        run: |
          xcodebuild -version
          flutter create --platforms=ios --org com.altayebat --project-name altayebat_app .
          python3 tool/prepare_ios_release.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Inspect build output
        run: |
          test -d build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist
      - uses: actions/upload-artifact@v7
        with:
          name: Altayebat-iOS-unsigned-build
          path: altayebat_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
